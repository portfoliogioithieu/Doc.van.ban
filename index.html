:root{
  --bg:#f6f7fb;
  --surface:#ffffff;
  --surface-2:#f1f4f9;
  --line:#e6eaf2;
  --text:#0f172a;
  --muted:#667085;
  --primary:#4f46e5;
  --primary-2:#7c3aed;
  --accent:#06b6d4;
  --success:#10b981;
  --warning:#f59e0b;
  --danger:#ef4444;
  --radius:22px;
  --radius-sm:14px;
  --shadow-sm:0 1px 2px rgba(16,24,40,.05),0 8px 24px rgba(16,24,40,.06);
  --shadow-md:0 18px 45px rgba(16,24,40,.10);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;
  font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  color:var(--text);
  background:
    radial-gradient(700px 420px at 5% 0%,rgba(79,70,229,.10),transparent 60%),
    radial-gradient(700px 420px at 100% 0%,rgba(6,182,212,.10),transparent 60%),
    radial-gradient(650px 450px at 50% 100%,rgba(124,58,237,.08),transparent 60%),
    var(--bg);
  background-attachment:fixed;
  padding:max(14px,env(safe-area-inset-top)) 14px max(30px,env(safe-area-inset-bottom));
  display:flex;justify-content:center;
}
.app{width:100%;max-width:1080px;display:flex;flex-direction:column;gap:16px}

/* Header */
.topbar{
  display:flex;align-items:center;justify-content:space-between;gap:14px;
  background:rgba(255,255,255,.82);
  border:1px solid rgba(255,255,255,.9);
  border-radius:20px;
  padding:14px 16px;
  box-shadow:var(--shadow-sm);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.mark{
  width:46px;height:46px;flex:0 0 auto;
  border-radius:15px;
  display:grid;place-items:center;
  color:#fff;font-weight:800;font-size:18px;
  background:linear-gradient(135deg,var(--primary),var(--primary-2) 55%,var(--accent));
  box-shadow:0 10px 24px rgba(79,70,229,.28);
}
.brand h1{margin:0;font-size:18px;font-weight:800;letter-spacing:-.02em}
.brand p{margin:2px 0 0;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{
  display:none;align-items:center;gap:7px;
  padding:9px 13px;border-radius:999px;
  background:var(--surface-2);
  border:1px solid var(--line);
  color:var(--muted);font-size:12px;font-weight:700;
}
@media(min-width:700px){.pill{display:flex}}
.dot{width:8px;height:8px;border-radius:50%;background:var(--success);box-shadow:0 0 0 4px rgba(16,185,129,.14)}

/* Layout */
.workspace{
  display:grid;grid-template-columns:1fr;gap:16px;
}
@media(min-width:900px){
  .workspace{grid-template-columns:1fr 1fr;align-items:start}
}
.panel{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--radius);
  box-shadow:var(--shadow-md);
  overflow:hidden;
}
.panel-head{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:16px 18px 0;
}
.panel-title{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:800}
.icon{
  width:34px;height:34px;border-radius:11px;display:grid;place-items:center;
  background:var(--surface-2);border:1px solid var(--line);
}
.tag{
  font-size:11px;font-weight:800;color:var(--muted);
  padding:6px 10px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);
}
.body{padding:16px 18px 18px}

textarea{
  width:100%;
  min-height:min(52vh,460px);
  padding:18px;
  border-radius:18px;
  border:1px solid var(--line);
  background:var(--surface-2);
  color:var(--text);
  font:inherit;font-size:17px;line-height:1.7;
  resize:vertical;outline:none;
  transition:border-color .2s,box-shadow .2s,background .2s;
}
textarea::placeholder{color:#98a2b3}
textarea:focus{
  background:#fff;
  border-color:rgba(79,70,229,.55);
  box-shadow:0 0 0 4px rgba(79,70,229,.11);
}

.language-row{
  display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:end;
  margin-top:14px;
}
.field label{display:block;font-size:11.5px;font-weight:800;color:var(--muted);margin-bottom:7px;text-transform:uppercase;letter-spacing:.05em}
select{
  width:100%;min-height:50px;padding:0 14px;
  border-radius:15px;border:1px solid var(--line);
  background:var(--surface-2);color:var(--text);
  font:inherit;font-size:15px;font-weight:600;outline:none;
  appearance:none;
  background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='16' height='16' fill='none' stroke='%23667085' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='m4 6 4 4 4-4'/%3E%3C/svg%3E");
  background-repeat:no-repeat;background-position:right 14px center;
}
select:focus{border-color:rgba(79,70,229,.55);box-shadow:0 0 0 4px rgba(79,70,229,.10)}
.swap-btn{
  width:50px;height:50px;border-radius:15px;border:1px solid var(--line);
  background:#fff;color:var(--primary);font-size:19px;font-weight:800;
  box-shadow:var(--shadow-sm);cursor:pointer;
  display:grid;place-items:center;
  transition:transform .15s ease,background .2s;
}
.swap-btn:active{transform:scale(.94)}
.swap-btn:hover{background:var(--surface-2)}

.toolbar{
  display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px;
}
@media(min-width:560px){.toolbar{grid-template-columns:repeat(3,1fr)}}
button{
  min-height:52px;padding:0 16px;
  border:none;border-radius:15px;
  font:inherit;font-size:14.5px;font-weight:800;color:#fff;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:8px;
  transition:transform .15s ease,box-shadow .2s ease,opacity .2s ease,background .2s;
}
button:active{transform:scale(.975)}
button:disabled{opacity:.55;cursor:not-allowed}
.btn-primary{background:linear-gradient(135deg,var(--primary),var(--primary-2));box-shadow:0 12px 26px rgba(79,70,229,.28)}
.btn-cyan{background:linear-gradient(135deg,#22d3ee,#0891b2);box-shadow:0 12px 26px rgba(6,182,212,.25)}
.btn-blue{background:linear-gradient(135deg,#60a5fa,#2563eb);box-shadow:0 12px 26px rgba(37,99,235,.25)}
.btn-amber{background:linear-gradient(135deg,#fbbf24,#f59e0b);box-shadow:0 12px 26px rgba(245,158,11,.25)}
.btn-red{background:linear-gradient(135deg,#fb7185,#ef4444);box-shadow:0 12px 26px rgba(239,68,68,.25)}
.btn-ghost{background:var(--surface-2);color:var(--text);border:1px solid var(--line);box-shadow:none}

.progress{
  height:8px;margin-top:15px;border-radius:999px;background:var(--surface-2);overflow:hidden;display:none;
}
.progress div{height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,var(--primary),var(--accent));transition:width .3s ease}
.status{
  display:flex;align-items:center;gap:8px;
  margin:13px 0 0;color:var(--muted);font-size:13px;min-height:20px;
}
.warn{
  display:none;margin-top:13px;padding:13px 14px;border-radius:15px;
  font-size:13px;line-height:1.55;color:#92400e;
  background:#fffbeb;border:1px solid #fde68a;
}
.footer{
  text-align:center;color:var(--muted);font-size:12px;margin:2px 0 0;
}
</style>
</head>
<body>
<main class="app">
  <header class="topbar">
    <div class="brand">
      <div class="mark">L</div>
      <div>
        <h1>Lingua</h1>
        <p>Dịch & đọc văn bản Anh – Việt</p>
      </div>
    </div>
    <div class="pill"><span class="dot"></span> Sẵn sàng dịch văn bản dài</div>
  </header>

  <section class="workspace">
    <section class="panel">
      <div class="panel-head">
        <div class="panel-title"><span class="icon">📝</span> Văn bản gốc</div>
        <div class="tag" id="charCount">0 ký tự</div>
      </div>
      <div class="body">
        <textarea id="source" placeholder="Dán hoặc nhập văn bản tiếng Việt / tiếng Anh...">Xin chào. Đây là ứng dụng dịch và đọc văn bản dài với giao diện hiện đại, tối ưu cho điện thoại.</textarea>

        <div class="language-row">
          <div class="field">
            <label for="sourceLang">Từ</label>
            <select id="sourceLang">
              <option value="vi">🇻🇳 Tiếng Việt</option>
              <option value="en">🇬🇧 Tiếng Anh</option>
            </select>
          </div>
          <button class="swap-btn" id="swap" title="Đổi chiều dịch">⇄</button>
          <div class="field">
            <label for="targetLang">Sang</label>
            <select id="targetLang">
              <option value="en">🇬🇧 Tiếng Anh</option>
              <option value="vi">🇻🇳 Tiếng Việt</option>
            </select>
          </div>
        </div>

        <div class="toolbar">
          <button id="translate" class="btn-primary">✨ Dịch toàn bộ</button>
          <button id="clear" class="btn-ghost">🧹 Xoá</button>
          <button id="copy" class="btn-ghost">📋 Copy</button>
        </div>

        <div class="progress" id="progress"><div></div></div>
        <p class="status" id="status">Sẵn sàng.</p>
        <div class="warn" id="warn"></div>
      </div>
    </section>

    <section class="panel">
      <div class="panel-head">
        <div class="panel-title"><span class="icon">🎧</span> Bản dịch & giọng đọc</div>
        <div class="tag" id="resultCount">0 ký tự</div>
      </div>
      <div class="body">
        <textarea id="result" placeholder="Kết quả dịch sẽ xuất hiện tại đây..."></textarea>

        <div class="language-row">
          <div class="field">
            <label for="voice">Giọng đọc</label>
            <select id="voice"></select>
          </div>
          <div class="field" style="grid-column:span 2">
            <label for="rate">Tốc độ: <span id="rateValue">1.0</span>x</label>
            <input id="rate" type="range" min="0.5" max="2" step="0.1" value="1" />
          </div>
        </div>

        <div class="toolbar">
          <button id="read" class="btn-blue">▶️ Đọc</button>
          <button id="pause" class="btn-amber">⏸️ Tạm dừng</button>
          <button id="stop" class="btn-red">⏹️ Dừng</button>
        </div>
      </div>
    </section>
  </section>

  <p class="footer">Cần kết nối Internet để dịch · Giọng đọc phụ thuộc vào giọng đã cài trên thiết bị</p>
</main>

<script>
const sourceEl=document.getElementById("source");
const resultEl=document.getElementById("result");
const sourceLangEl=document.getElementById("sourceLang");
const targetLangEl=document.getElementById("targetLang");
const voiceEl=document.getElementById("voice");
const rateEl=document.getElementById("rate");
const rateValue=document.getElementById("rateValue");
const statusEl=document.getElementById("status");
const warnEl=document.getElementById("warn");
const progressEl=document.getElementById("progress");
const progressBar=progressEl.querySelector("div");
const translateBtn=document.getElementById("translate");
const charCount=document.getElementById("charCount");
const resultCount=document.getElementById("resultCount");

const languageNames={vi:"Tiếng Việt",en:"Tiếng Anh"};
const MAX_CHUNK=450;
let translating=false;

function updateCounts(){
  charCount.textContent=sourceEl.value.length.toLocaleString("vi-VN")+" ký tự";
  resultCount.textContent=resultEl.value.length.toLocaleString("vi-VN")+" ký tự";
}

sourceEl.addEventListener("input",updateCounts);
resultEl.addEventListener("input",updateCounts);
sourceLangEl.addEventListener("change",()=>{
  targetLangEl.value=sourceLangEl.value==="vi"?"en":"vi";
  loadVoices();
});
targetLangEl.addEventListener("change",loadVoices);
rateEl.addEventListener("input",()=>rateValue.textContent=Number(rateEl.value).toFixed(1));

const sleep=ms=>new Promise(r=>setTimeout(r,ms));

function splitText(text){
  const clean=text.replace(/\s+/g," ").trim();
  const sentences=clean.split(/(?<=[.!?。！？])\s+/);
  const parts=[];
  let current="";

  for(const sentence of sentences){
    if(sentence.length<=MAX_CHUNK){
      const candidate=current?current+" "+sentence:sentence;
      if(candidate.length<=MAX_CHUNK) current=candidate;
      else{
        if(current)parts.push(current);
        current=sentence;
      }
    }else{
      if(current){parts.push(current);current="";}
      let piece="";
      for(const word of sentence.split(" ")){
        const candidate=piece?piece+" "+word:word;
        if(candidate.length<=MAX_CHUNK) piece=candidate;
        else{parts.push(piece);piece=word;}
      }
      current=piece;
    }
  }
  if(current)parts.push(current);
  return parts;
}

async function translateChunk(text,from,to){
  const url="https://api.mymemory.translated.net/get?q="+encodeURIComponent(text)+"&langpair="+from+"|"+to;
  const response=await fetch(url);
  if(!response.ok)throw new Error("HTTP "+response.status);
  const data=await response.json();
  const translated=data?.responseData?.translatedText;
  if(!translated)throw new Error("No translation");
  return translated;
}

document.getElementById("swap").onclick=()=>{
  const from=sourceLangEl.value;
  sourceLangEl.value=targetLangEl.value;
  targetLangEl.value=from;
  const temp=sourceEl.value;
  sourceEl.value=resultEl.value;
  resultEl.value=temp;
  updateCounts();
  loadVoices();
};

document.getElementById("clear").onclick=()=>{
  sourceEl.value="";
  resultEl.value="";
  updateCounts();
  statusEl.textContent="Đã xoá văn bản.";
};

document.getElementById("copy").onclick=async()=>{
  const text=resultEl.value.trim();
  if(!text){statusEl.textContent="Chưa có bản dịch để sao chép.";return;}
  try{
    await navigator.clipboard.writeText(text);
    statusEl.textContent="Đã sao chép bản dịch.";
  }catch(e){
    resultEl.select();
    document.execCommand("copy");
    statusEl.textContent="Đã sao chép bản dịch.";
  }
};

translateBtn.onclick=async()=>{
  if(translating)return;
  const text=sourceEl.value.trim();
  const from=sourceLangEl.value;
  const to=targetLangEl.value;

  if(!text){statusEl.textContent="Vui lòng nhập hoặc dán văn bản cần dịch.";return;}

  translating=true;
  translateBtn.disabled=true;
  resultEl.value="";
  progressEl.style.display="block";
  progressBar.style.width="0%";

  const chunks=splitText(text);
  const output=[];

  try{
    for(let i=0;i<chunks.length;i++){
      statusEl.textContent="Đang dịch phần "+(i+1)+" / "+chunks.length+"...";
      output.push(await translateChunk(chunks[i],from,to));
      resultEl.value=output.join(" ");
      updateCounts();
      progressBar.style.width=((i+1)/chunks.length*100)+"%";
      await sleep(350);
    }
    statusEl.textContent="Đã dịch "+text.length.toLocaleString("vi-VN")+" ký tự thành "+chunks.length+" phần.";
  }catch(e){
    statusEl.textContent="Dịch bị gián đoạn. Bản dịch hiện có vẫn được giữ; hãy thử lại sau ít phút.";
  }finally{
    translating=false;
    translateBtn.disabled=false;
    setTimeout(()=>progressEl.style.display="none",800);
    loadVoices();
  }
};

function getVoicesFor(language){
  return speechSynthesis.getVoices().filter(v=>v.lang.toLowerCase().startsWith(language));
}

function loadVoices(){
  if(!("speechSynthesis" in window)){
    warnEl.textContent="Trình duyệt này không hỗ trợ đọc văn bản.";
    warnEl.style.display="block";
    return;
  }

  const language=targetLangEl.value;
  const voices=getVoicesFor(language);
  voiceEl.innerHTML="";
  warnEl.style.display="none";

  if(!voices.length){
    warnEl.textContent="Chưa tìm thấy giọng "+languageNames[language]+". Hãy cài gói giọng đọc "+languageNames[language]+" trong cài đặt thiết bị rồi tải lại trang.";
    warnEl.style.display="block";
    return;
  }

  voices.forEach((voice,i)=>{
    const option=document.createElement("option");
    option.value=i;
    option.textContent=voice.name+" ("+voice.lang+")";
    voiceEl.appendChild(option);
  });
  voiceEl.value=0;
}

document.getElementById("read").onclick=()=>{
  const content=resultEl.value.trim();
  if(!content){statusEl.textContent="Chưa có kết quả dịch để đọc.";return;}

  speechSynthesis.cancel();

  const language=targetLangEl.value;
  const voices=getVoicesFor(language);
  const selectedVoice=voices[voiceEl.value];

  if(!selectedVoice){
    statusEl.textContent="Chưa có giọng "+languageNames[language]+".";
    warnEl.style.display="block";
    return;
  }

  const speech=new SpeechSynthesisUtterance(content);
  speech.voice=selectedVoice;
  speech.lang=selectedVoice.lang;
  speech.rate=Number(rateEl.value);

  speech.onstart=()=>statusEl.textContent="Đang đọc "+languageNames[language]+"...";
  speech.onend=()=>statusEl.textContent="Đã đọc xong.";
  speech.onerror=()=>statusEl.textContent="Không đọc được văn bản.";

  speechSynthesis.speak(speech);
};

document.getElementById("pause").onclick=()=>{
  if(speechSynthesis.speaking&&!speechSynthesis.paused){
    speechSynthesis.pause();
    statusEl.textContent="Đã tạm dừng.";
  }else if(speechSynthesis.paused){
    speechSynthesis.resume();
    statusEl.textContent="Đang đọc tiếp...";
  }
};

document.getElementById("stop").onclick=()=>{
  speechSynthesis.cancel();
  statusEl.textContent="Đã dừng.";
};

updateCounts();
loadVoices();
speechSynthesis.onvoiceschanged=loadVoices;
</script>
</body>
</html>
